stages:
  - install
  - checks
  - deploy

default:
  # Keep dependency installation and execution on the same Ubuntu/Node image.
  # Ubuntu is also required for mongodb-memory-server binary availability.
  image: registry.gitlab.com/adaptivestone/ubuntu-node:latest

install:
  stage: install
  script:
    # Keep cross-platform optional dependencies resolvable after an ARM install.
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 2 hour

quality:
  stage: checks
  needs:
    - install
  allow_failure: true
  script:
    - npm run check

tests:
  needs:
    - install
  services:
    - redis:latest
  variables:
    REDIS_URI: redis://redis
    EMAIL_TRANSPORT: stub
  stage: checks
  script:
    - npm run test:ci
  coverage: '/[Aa]ll files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/lcov.info


